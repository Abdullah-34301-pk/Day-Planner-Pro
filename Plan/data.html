<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data — Plan</title>
  <link rel="stylesheet" href="css/styles.css" />
  <style>
    .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .stat-card { background: var(--surface-soft); border: 1px solid var(--hairline); border-radius: 12px; padding: 14px; text-align: center; }
    .stat-value { font-size: 1.5rem; font-weight: 700; color: var(--primary); }
    .stat-label { font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 4px; }
    .import-preview { padding: 12px; border-radius: 12px; background: var(--surface-soft); margin-top: 10px; }
    .import-actions { display: flex; gap: 8px; margin-top: 10px; }
    .import-preview .success { color: var(--success); font-weight: 600; }
    .import-preview .error { color: var(--error); font-weight: 600; }
    @media (max-width: 760px) { .stats-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-brand">
        <span class="sidebar-logo">◉</span>
        <span class="sidebar-brand-text">Day Planner</span>
      </div>
      <div class="sidebar-links">
        <a href="index.html" class="nav-btn">
          <span class="nav-icon">◉</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="add-task.html" class="nav-btn">
          <span class="nav-icon">+</span>
          <span class="nav-label">Add Task</span>
        </a>
        <a href="plans.html" class="nav-btn">
          <span class="nav-icon">☰</span>
          <span class="nav-label">Plans</span>
        </a>
        <a href="insight.html" class="nav-btn">
          <span class="nav-icon">◈</span>
          <span class="nav-label">Insights</span>
        </a>
        <a href="timer.html" class="nav-btn">
          <span class="nav-icon">◷</span>
          <span class="nav-label">Timer</span>
        </a>
        <a href="data.html" class="nav-btn active" aria-current="page">
          <span class="nav-icon">↻</span>
          <span class="nav-label">Data</span>
        </a>
      </div>
    </nav>

    <main class="main-content">
      <div class="page-header">
        <h2>Data</h2>
      </div>

      <div class="panel reveal">
        <h3>Task stats</h3>
        <div id="task-stats" class="stats-grid"></div>
      </div>
      <div class="panel reveal">
        <h3>Focus stats</h3>
        <div id="focus-stats" class="stats-grid"></div>
      </div>
      <div class="panel reveal">
        <h3>Streak stats</h3>
        <div id="streak-stats" class="stats-grid"></div>
      </div>
      <div class="panel reveal">
        <h3>Rewards stats</h3>
        <div id="rewards-stats" class="stats-grid"></div>
      </div>

      <div class="panel reveal data-card">
        <h3>Save or load your JSON data</h3>
        <p>Your planner auto-saves locally, and you can export or import a JSON backup anytime.</p>
        <div class="actions">
          <button type="button" id="import-button" class="secondary-btn">Import JSON</button>
          <input id="json-import" type="file" accept="application/json" hidden />
          <button type="button" id="export-button" class="secondary-btn">Export JSON</button>
          <button type="button" id="excel-export-button" class="primary-btn">Export Excel</button>
        </div>
        <div id="import-preview" class="hidden"></div>
      </div>
    </main>
  </div>

  <p id="status-message" class="status-message hidden" aria-live="polite"></p>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/data.js"></script>
</body>
</html>
