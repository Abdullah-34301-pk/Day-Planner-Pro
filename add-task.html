<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Add Task — Plan</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-brand">
        <span class="sidebar-logo">◉</span>
        <span class="sidebar-brand-text">Day Planner</span>
      </div>
      <div class="sidebar-links">
        <a href="index.html" class="nav-btn">
          <span class="nav-icon">◉</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="add-task.html" class="nav-btn active" aria-current="page">
          <span class="nav-icon">+</span>
          <span class="nav-label">Add Task</span>
        </a>
        <a href="plans.html" class="nav-btn">
          <span class="nav-icon">☰</span>
          <span class="nav-label">Plans</span>
        </a>
        <a href="insight.html" class="nav-btn">
          <span class="nav-icon">◈</span>
          <span class="nav-label">Insights</span>
        </a>
        <a href="timer.html" class="nav-btn">
          <span class="nav-icon">◷</span>
          <span class="nav-label">Timer</span>
        </a>
        <a href="data.html" class="nav-btn">
          <span class="nav-icon">↻</span>
          <span class="nav-label">Data</span>
        </a>
      </div>
    </nav>

    <main class="main-content">
      <div class="page-header">
        <h2>Add Task</h2>
      </div>
      <form id="planner-form">
        <div class="field-group">
          <label for="title">Task or plan</label>
          <input id="title" name="title" type="text" placeholder="Write your plan" required />
        </div>

        <div class="field-row">
          <div class="field-group">
            <label for="date">Date</label>
            <input id="date" name="date" type="date" />
          </div>
          <div class="field-group">
            <label for="quick-date">Quick date</label>
            <input id="quick-date" name="quick-date" type="text" placeholder="tomorrow, next week, Monday" />
          </div>
          <div class="field-group">
            <label for="category">Category</label>
            <select id="category" name="category">
              <option value="General">General</option>
              <option value="Work">Work</option>
              <option value="Study">Study</option>
              <option value="Health">Health</option>
              <option value="Personal">Personal</option>
              <option value="Chores">Chores</option>
            </select>
          </div>
          <div class="field-group checkbox-group">
            <label for="urgent">Urgent</label>
            <input id="urgent" name="urgent" type="checkbox" />
          </div>
        </div>

        <div class="field-row">
          <div class="field-group">
            <label for="priority">Priority</label>
            <select id="priority" name="priority">
              <option value="Low">Low</option>
              <option value="Medium" selected>Medium</option>
              <option value="High">High</option>
              <option value="Urgent">Urgent</option>
            </select>
          </div>
          <div class="field-group">
            <label for="difficulty">Difficulty</label>
            <select id="difficulty" name="difficulty">
              <option value="Easy">Easy</option>
              <option value="Medium" selected>Medium</option>
              <option value="Hard">Hard</option>
              <option value="Very Hard">Very Hard</option>
            </select>
          </div>
          <div class="field-group">
            <label for="repeat-rule">Repeat</label>
            <select id="repeat-rule" name="repeat-rule">
              <option value="none">None</option>
              <option value="daily">Daily</option>
              <option value="weekly">Weekly</option>
              <option value="monthly">Monthly</option>
            </select>
          </div>
          <div class="field-group">
            <label for="bucket">Bucket</label>
            <select id="bucket" name="bucket">
              <option value="Today">Today</option>
              <option value="Upcoming">Upcoming</option>
              <option value="Anytime">Anytime</option>
              <option value="Someday">Someday</option>
            </select>
          </div>
        </div>

        <div class="field-group">
          <label for="tags">Tags</label>
          <input id="tags" name="tags" type="text" placeholder="work, deep-focus" />
        </div>

        <div class="field-group">
          <label for="subtasks">Subtasks</label>
          <textarea id="subtasks" name="subtasks" rows="3" placeholder="One subtask per line"></textarea>
        </div>

        <div class="field-group">
          <label for="notes">Notes</label>
          <textarea id="notes" name="notes" rows="3" placeholder="Add details or steps"></textarea>
        </div>

        <div class="quick-add-row">
          <span class="mini-label">Quick add</span>
          <button type="button" class="quick-add-btn" data-title="Write one focused note" data-category="Study">Study sprint</button>
          <button type="button" class="quick-add-btn" data-title="Workout" data-category="Health">Workout</button>
          <button type="button" class="quick-add-btn" data-title="Follow up on work" data-category="Work">Work follow-up</button>
        </div>

        <div class="actions">
          <button type="submit" class="primary-btn" id="submit-btn">Add task</button>
          <button type="button" class="secondary-btn hidden" id="cancel-edit-btn">Cancel edit</button>
        </div>
      </form>
    </main>
  </div>

  <p id="status-message" class="status-message hidden" aria-live="polite"></p>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/add-task.js"></script>
</body>
</html>
