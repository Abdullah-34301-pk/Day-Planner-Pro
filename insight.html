<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Insights — Plan</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-brand">
        <span class="sidebar-logo">◉</span>
        <span class="sidebar-brand-text">Day Planner</span>
      </div>
      <div class="sidebar-links">
        <a href="index.html" class="nav-btn">
          <span class="nav-icon">◉</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="add-task.html" class="nav-btn">
          <span class="nav-icon">+</span>
          <span class="nav-label">Add Task</span>
        </a>
        <a href="plans.html" class="nav-btn">
          <span class="nav-icon">☰</span>
          <span class="nav-label">Plans</span>
        </a>
        <a href="insight.html" class="nav-btn active" aria-current="page">
          <span class="nav-icon">◈</span>
          <span class="nav-label">Insights</span>
        </a>
        <a href="timer.html" class="nav-btn">
          <span class="nav-icon">◷</span>
          <span class="nav-label">Timer</span>
        </a>
        <a href="data.html" class="nav-btn">
          <span class="nav-icon">↻</span>
          <span class="nav-label">Data</span>
        </a>
      </div>
    </nav>

    <main class="main-content">
      <div class="page-header">
        <h2>Insights</h2>
      </div>

      <div class="insights-grid">
        <div class="insight-card reveal">
          <h3>Weekly momentum</h3>
          <div id="weekly-momentum"></div>
        </div>
        <div class="insight-card reveal">
          <h3>Momentum chart</h3>
          <div id="momentum-chart" class="history-bars"></div>
        </div>
        <div class="insight-card reveal">
          <h3>Next up</h3>
          <div id="next-up"></div>
        </div>
        <div class="insight-card reveal">
          <h3>Task log</h3>
          <div id="task-log"></div>
        </div>
        <div class="insight-card reveal">
          <h3>Heatmap</h3>
          <div id="heatmap" class="heatmap"></div>
        </div>
        <div class="insight-card reveal">
          <h3>Streaks</h3>
          <div id="streak-display"></div>
        </div>
        <div class="insight-card reveal">
          <h3>XP</h3>
          <div id="xp-display"></div>
        </div>
      </div>
    </main>
  </div>

  <p id="status-message" class="status-message hidden" aria-live="polite"></p>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/insight.js"></script>
</body>
</html>
