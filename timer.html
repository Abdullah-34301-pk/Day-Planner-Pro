<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Timer — Plan</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="app-shell">
    <nav class="sidebar" role="navigation" aria-label="Main navigation">
      <div class="sidebar-brand">
        <span class="sidebar-logo">◉</span>
        <span class="sidebar-brand-text">Day Planner</span>
      </div>
      <div class="sidebar-links">
        <a href="index.html" class="nav-btn">
          <span class="nav-icon">◉</span>
          <span class="nav-label">Dashboard</span>
        </a>
        <a href="add-task.html" class="nav-btn">
          <span class="nav-icon">+</span>
          <span class="nav-label">Add Task</span>
        </a>
        <a href="plans.html" class="nav-btn">
          <span class="nav-icon">☰</span>
          <span class="nav-label">Plans</span>
        </a>
        <a href="insight.html" class="nav-btn">
          <span class="nav-icon">◈</span>
          <span class="nav-label">Insights</span>
        </a>
        <a href="timer.html" class="nav-btn active" aria-current="page">
          <span class="nav-icon">◷</span>
          <span class="nav-label">Timer</span>
        </a>
        <a href="data.html" class="nav-btn">
          <span class="nav-icon">↻</span>
          <span class="nav-label">Data</span>
        </a>
      </div>
    </nav>

    <main class="main-content">
      <div class="page-header">
        <h2>Focus Timer</h2>
      </div>
      <div class="timer-page-layout">
        <div class="panel timer-page-main reveal">
          <div class="timer-mode-row">
            <label><input type="radio" name="timer-mode" value="pomodoro" checked /> Pomodoro</label>
            <label><input type="radio" name="timer-mode" value="short-break" /> Short break</label>
            <label><input type="radio" name="timer-mode" value="long-break" /> Long break</label>
            <label><input type="radio" name="timer-mode" value="custom" /> Custom</label>
          </div>
          <div class="timer-custom-wrap">
            <label for="timer-custom">Custom minutes</label>
            <input id="timer-custom" type="number" min="1" max="999" placeholder="25" disabled />
          </div>
          <div id="timer-display" class="timer-display">25:00</div>
          <div class="timer-bar">
            <div id="timer-progress" class="timer-progress" style="width:0%"></div>
          </div>
          <div class="actions timer-actions">
            <button type="button" id="timer-start-btn" class="primary-btn timer-btn">Start</button>
            <button type="button" id="timer-pause-btn" class="secondary-btn timer-btn" disabled>Pause</button>
            <button type="button" id="timer-reset-btn" class="secondary-btn timer-btn">Reset</button>
          </div>
          <div id="break-time" class="hidden" style="margin-top:12px;color:var(--success);font-weight:600">Time for a break</div>
          <div id="focus-complete" class="hidden" style="margin-top:12px">
            <div style="font-size:1.4rem;font-weight:700;color:var(--success)">Focus session complete</div>
            <div style="color:var(--muted)"><span class="focus-complete-minutes">0</span> minutes · <span class="focus-time-display">0m</span></div>
          </div>
        </div>
        <div class="panel reveal">
          <h3>Session history</h3>
          <div class="focus-summary">
            <span class="mini-label">Total focus time</span>
            <div id="total-focus-minutes" class="focus-value" style="font-size:1.8rem">0</div>
            <span>minutes</span>
          </div>
          <div id="session-list" class="timer-history"></div>
        </div>
      </div>
    </main>
  </div>

  <p id="status-message" class="status-message hidden" aria-live="polite"></p>
  <script src="js/store.js"></script>
  <script src="js/utils.js"></script>
  <script src="js/timer.js"></script>
</body>
</html>
